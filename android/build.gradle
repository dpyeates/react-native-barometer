buildscript {
  ext.safeExtGet = {prop, fallback ->
    rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
  }
  repositories {
    google()
    gradlePluginPortal()
  }
  dependencies {
    classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${safeExtGet('kotlinVersion', '2.2.0')}")
  }
}

apply plugin: "com.android.library"
apply plugin: "kotlin-android"
apply plugin: "com.facebook.react"

def safeExtGet(prop, fallback) {
  rootProject.ext.has(prop) ? rootProject.ext.get(prop) : fallback
}

react {
  libraryName = "RNBarometer"
  codegenJavaPackageName = "com.sensorworks.RNBarometer"
}

android {
  namespace "com.sensorworks.RNBarometer"

  compileSdkVersion safeExtGet("compileSdkVersion", 37)

  defaultConfig {
    minSdkVersion safeExtGet("minSdkVersion", 24)
    targetSdkVersion safeExtGet("targetSdkVersion", 36)
  }

  lintOptions {
    abortOnError false
  }
}

repositories {
  maven {
    url "$rootDir/../node_modules/react-native/android"
  }
  google()
  mavenCentral()
}

dependencies {
  implementation "com.facebook.react:react-native:+"
}
